name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Newer pushes supersede CI only; deployment and recovery are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sahaay
      GOOGLE_API_KEY: dummy
      NEXT_PUBLIC_GOOGLE_API_KEY: dummy
      JWT_SECRET: ci-test-secret
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sahaay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sahaay"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: my-app

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: my-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: |
          npm run format
          git diff --exit-code

      - name: Apply database schema
        run: npm run db:migrate
        
      - name: Build check
        run: npm run build
        
      - name: Start Next.js Server
        run: |
          npm run start &
          npx --no-install wait-on --timeout 60000 http://127.0.0.1:3000

      - name: Run Tests
        run: npm run test:bdd
